<div
  style="
    background: #ddefd3;
    padding: 32px 16px;
    font-family: Arial, Helvetica, sans-serif;
  "
>
  <div
    style="
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
    "
  >
    <h1
      style="
        margin: 0 0 4px;
        color: #1b5e20;
        font-size: 26px;
        letter-spacing: 1px;
      "
    >
      ERECYCLOMATCH
    </h1>
    <p style="margin: 0 0 24px; color: #777; font-size: 13px">
      Matching e-waste with recycling facilities
    </p>

    <h2 style="margin: 0 0 12px; color: #333; font-size: 20px">
      Thank you for signing up!
    </h2>
    <p style="margin: 0 0 24px; color: #555; font-size: 15px; line-height: 1.5">
      Please confirm your email address to activate your ERecycloMatch account.
    </p>

    <a
      href="{{ .ConfirmationURL }}"
      style="
        display: inline-block;
        background: #1b5e20;
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        font-size: 16px;
        padding: 14px 32px;
        border-radius: 12px;
      "
    >
      Verify Email
    </a>

    <p style="margin: 24px 0 0; color: #999; font-size: 12px; line-height: 1.5">
      If you didn't create an ERecycloMatch account, you can ignore this email.
    </p>
  </div>
</div>
